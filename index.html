<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian Saringan Masuk - Mata Uji Bahasa Inggris</title>
<style>
:root{
  --primary:#4637d5;
  --primary-dark:#3829bb;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#182230;
  --muted:#68758a;
  --border:#e2e8f0;
  --success:#079669;
  --warning:#f4b740;
  --danger:#df4f4f;
  --shadow:0 2px 10px rgba(31,41,55,.07);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:46px}
header{
  height:76px;background:var(--primary);color:#fff;padding:9px 7.5%;
  display:flex;align-items:center;box-shadow:0 2px 7px rgba(0,0,0,.12)
}
.brand h1{font-size:23px;margin:0 0 2px;font-weight:800}
.brand p{font-size:14px;margin:0;opacity:.78}
.app{flex:1;width:100%;max-width:1250px;margin:18px auto 30px;display:grid;grid-template-columns:290px 1fr;gap:24px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.sidebar{display:flex;flex-direction:column;gap:16px}
.info,.nav{padding:17px}
.card-title{font-size:14px;font-weight:800;margin:0 0 11px;text-transform:uppercase}
.line{height:1px;background:var(--border);margin-bottom:14px}
label{font-size:13px;color:#4d5b6e}
input[type=text]{width:100%;margin-top:7px;padding:11px 12px;border:1px solid #ccd6e3;border-radius:8px;font-size:14px;outline:none}
input[type=text]:focus{border-color:var(--primary)}
.counter{float:right;background:#eef2f7;color:#718096;padding:4px 8px;border-radius:5px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.qnav{
  height:38px;border:1px solid #dfe6ef;background:#fff;border-radius:8px;
  font-weight:700;color:#30415a;cursor:pointer
}
.qnav:hover{border-color:var(--primary)}
.qnav.active{border:2px solid #5b4df0;color:var(--primary);background:#fafaff}
.qnav.answered{background:#e9f8f3;border-color:#9cddc9;color:#087b5a}
.qnav.result-correct{background:#09a66f;border-color:#09a66f;color:#fff}
.qnav.result-wrong{background:#f2385a;border-color:#f2385a;color:#fff}
.qnav.result-correct.active,.qnav.result-wrong.active{color:#fff}
.qnav.result-correct.active{box-shadow:0 0 0 2px #5b4df0 inset}
.qnav.result-wrong.active{box-shadow:0 0 0 2px #5b4df0 inset}
.finish{
  width:100%;border:0;background:var(--success);color:#fff;border-radius:10px;
  padding:14px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 3px 7px rgba(7,150,105,.2)
}
.finish:hover{filter:brightness(.96)}
.finish.finished{
  background:#9aa3ad;
  border-color:#9aa3ad;
  color:#fff;
  cursor:not-allowed;
  box-shadow:none;
}
.finish.finished:hover{filter:none}
.main{min-width:0}
.question-card{overflow:hidden}
.qhead{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.qtitle{font-size:18px;color:var(--primary);font-weight:800}
.status{background:#fff4d2;color:#a56b00;border-radius:18px;padding:6px 12px;font-size:12px;font-weight:700}
.status.done{background:#e9f8f3;color:#087b5a}
.qbody{padding:30px 24px 24px;min-height:460px}
.question-text{font-size:17px;line-height:1.7;margin:0 0 25px}
.options{display:flex;flex-direction:column;gap:11px}
.option{
  border:1px solid #dfe6ef;border-radius:11px;padding:15px 16px;
  display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:.15s;background:#fff
}
.option:hover{border-color:#aaa0ff;background:#fbfaff}
.option.selected{border:2px solid #5b4df0;background:#f8f7ff}
.option input{margin-top:3px;accent-color:var(--primary);transform:scale(1.08)}
.letter{width:28px;height:28px;border:1px solid #d7e0ea;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.option.selected .letter{border-color:var(--primary);color:var(--primary)}
.qfooter{border-top:1px solid var(--border);padding:15px 24px;display:flex;justify-content:space-between}
.navbtn{border:1px solid #dbe3ec;background:#fff;color:#516174;padding:10px 17px;border-radius:8px;cursor:pointer;font-weight:700}
.navbtn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.navbtn:disabled{opacity:.4;cursor:not-allowed}
.result{display:none;padding:0;overflow:hidden}
.result.show{display:block}
.result-hero{
  background:linear-gradient(135deg,#4637d5 0%,#5b4df0 55%,#6a5cf6 100%);
  color:#fff;padding:34px 34px 30px;position:relative;overflow:hidden
}
.result-hero:after{
  content:"";position:absolute;width:230px;height:230px;border-radius:50%;
  right:-75px;top:-105px;background:rgba(255,255,255,.09)
}
.result-kicker{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;opacity:.8;margin:0 0 7px}
.result-hero h2{font-size:27px;margin:0 0 8px}
.result-name{margin:0;font-size:14px;opacity:.9}
.result-main{display:flex;align-items:center;gap:28px;margin-top:26px;position:relative;z-index:1}
.score-ring{
  width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.14);
  border:7px solid rgba(255,255,255,.88);display:flex;flex-direction:column;
  justify-content:center;align-items:center;flex:none;box-shadow:0 8px 24px rgba(29,20,130,.2)
}
.score-ring .score{font-size:38px;line-height:1;font-weight:900;margin:0}
.score-ring small{font-size:11px;margin-top:5px;opacity:.85}
.result-summary h3{font-size:17px;margin:0 0 6px}
.result-summary p{margin:0;font-size:14px;opacity:.9}
.result-content{padding:25px 30px 30px}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{
  border:1px solid var(--border);background:#fff;border-radius:12px;padding:15px;
  box-shadow:0 2px 8px rgba(31,41,55,.04)
}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:5px}
.stat-value{font-size:21px;font-weight:850;color:#172033}
.result-box{
  background:#f7f8fc;border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin-bottom:24px;font-size:13px;color:#526174
}
.review{margin-top:0}
.review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.review-header h3{font-size:17px;margin:0}
.review-header span{font-size:12px;color:var(--muted)}
.review-item{
  padding:13px 14px;border:1px solid var(--border);border-radius:10px;
  margin:8px 0;background:#fff;font-size:13px;line-height:1.55
}
.review-description{margin:6px 0 7px;padding:8px 10px;border-radius:7px;background:#f7f8fc;color:#59677a;font-size:12.5px;line-height:1.55}
.correct{color:var(--success);font-weight:800}
.wrong{color:var(--danger);font-weight:800}
.reset{margin-top:20px;width:100%;background:var(--primary)}
@media(max-width:800px){
  .result-main{align-items:flex-start}
  .result-stats{grid-template-columns:1fr}
  .result-content{padding:20px 16px 24px}
  .result-hero{padding:26px 20px}
}
.math{font-family:Cambria,Georgia,serif;font-size:1.05em}
table{border-collapse:collapse;margin:14px 0;font-size:15px}
td,th{border:1px solid #ccd5df;padding:7px 13px;text-align:center}
@media(max-width:800px){
  header{padding:10px 18px;height:auto}
  .app{grid-template-columns:1fr;padding:0 10px}
  .sidebar{order:2}
  .main{order:1}
  .qbody{min-height:auto;padding:22px 16px}
  .qhead{padding:16px}
  .qfooter{padding:12px 16px}
}

/* Professional result report */
.result-report-note{font-size:12px;color:#64748b;margin-top:8px}

.site-footer{
  position:fixed;left:0;right:0;bottom:0;z-index:1000;
  background:#fff;border-top:1px solid var(--border);
  padding:14px 20px;text-align:center;color:#68758a;font-size:12px;
  box-shadow:0 -2px 8px rgba(31,41,55,.06);
}
.timer-card{padding:17px}
.timer-value{font-size:30px;font-weight:900;letter-spacing:1px;color:var(--primary);text-align:center;margin:2px 0 5px}
.timer-note{text-align:center;font-size:11px;color:var(--muted)}
.timer-card.danger .timer-value{color:var(--danger)}
.timer-card.danger .timer-note{color:var(--danger);font-weight:800}
</style>
</head>

<script>
let timeRemaining = 120 * 60;
let timerInterval = null;
let timerStarted = false;

function formatTime(totalSeconds){
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return String(minutes).padStart(2,'0') + ':' + String(seconds).padStart(2,'0');
}

function updateTimer(){
  const timer=document.getElementById('timer');
  const card=document.getElementById('timerCard');
  const note=document.getElementById('timerNote');
  if(timer) timer.textContent=formatTime(Math.max(0,timeRemaining));
  if(timeRemaining<=300){
    card?.classList.add('danger');
    if(note && !examFinished) note.textContent='Waktu hampir habis';
  }
  if(timeRemaining<=0){
    clearInterval(timerInterval);
    timerInterval=null;
    if(note) note.textContent='Waktu habis';
    finishQuiz(true);
  }
}

function startTimer(){
  if(timerStarted) return;
  timerStarted=true;
  updateTimer();
  timerInterval=setInterval(()=>{
    if(examFinished){ clearInterval(timerInterval); timerInterval=null; return; }
    timeRemaining--;
    updateTimer();
  },1000);
}

nge their habits.<br><br><b>4. What is the communicative purpose of the text?</b>","o":["To describe the physical appearance of recycling facilities.","To retell a past experience and highlight its lesson.","To explain how plastic is manufactured in factories.","To persuade readers to stop attending school campaigns.","To compare different types of environmental pollution."],"a":1},{"q":"<b>Text 2</b><br><br>Last semester, a group of students conducted a campaign to reduce plastic waste at their school. They placed recycling bins in several locations and created posters explaining the environmental impact of single-use plastics. Initially, only a few students participated in the program.<br><br>Instead of abandoning their efforts, the campaign team organized short presentations in classrooms and invited students to bring reusable bottles. After several weeks, participation increased significantly. The project demonstrated that environmental awareness alone was not always enough; people also needed practical opportunities and encouragement to change their habits.<br><br><b>5. What did the campaign team do when participation was initially low?</b>","o":["They removed all recycling bins from the school.","They stopped producing educational materials.","They changed their approach by giving presentations and encouraging reusable bottles.","They asked students to pay a fine for using plastic.","They transferred the campaign to another school."],"a":2},{"q":"<b>Text 2</b><br><br>Last semester, a group of students conducted a campaign to reduce plastic waste at their school. They placed recycling bins in several locations and created posters explaining the environmental impact of single-use plastics. Initially, only a few students participated in the program.<br><br>Instead of abandoning their efforts, the campaign team organized short presentations in classrooms and invited students to bring reusable bottles. After several weeks, participation increased significantly. The project demonstrated that environmental awareness alone was not always enough; people also needed practical opportunities and encouragement to change their habits.<br><br><b>6. What can be inferred from the campaign's results?</b>","o":["Environmental campaigns are successful only when students receive rewards.","Students generally refuse to participate in school activities.","Providing practical actions and encouragement can help change people's habits.","Recycling bins are unnecessary when posters are available.","Environmental awareness has no influence on student behavior."],"a":2},{"q":"<b>Text 3</b><br><br>Urban trees play an important role in maintaining environmental quality. They provide shade, absorb carbon dioxide, and help reduce the temperature in densely populated areas. Their roots can also improve water absorption, reducing surface runoff during heavy rainfall.<br><br>Nevertheless, planting trees in cities requires careful consideration. Some species have roots that may damage pavements or underground pipes, while others cannot survive in polluted environments. City planners should therefore select appropriate species and provide adequate maintenance to ensure that urban trees deliver long-term benefits.<br><br><b>7. What is the main purpose of the text?</b>","o":["To narrate the history of urban development.","To describe the appearance of different tree species.","To explain the benefits of urban trees and the importance of proper planning.","To argue that all city buildings should be replaced by forests.","To instruct readers on how to cut down damaged trees."],"a":2},{"q":"<b>Text 3</b><br><br>Urban trees play an important role in maintaining environmental quality. They provide shade, absorb carbon dioxide, and help reduce the temperature in densely populated areas. Their roots can also improve water absorption, reducing surface runoff during heavy rainfall.<br><br>Nevertheless, planting trees in cities requires careful consideration. Some speci ed before giving a presentation. What is the most appropriate expression to encourage them?</b>","o":["You should have prepared everything yesterday.","Don't worry. Take a deep breath and do your best.","I knew you would fail the presentation.","You had better cancel the presentation immediately.","It is your fault that you feel nervous."],"a":1},{"q":"<b>21. Which sentence expresses a suggestion?</b>","o":["Would you mind closing the window?","I am certain that the window is closed.","You should discuss the problem with your teacher.","The window was closed this morning.","Why did you close the window?"],"a":2},{"q":"<b>22. A student wants to borrow a dictionary from a classmate. Which expression is the most polite?</b>","o":["Give me your dictionary now.","You must lend me your dictionary.","I am taking your dictionary because I need it.","Could I borrow your dictionary for a moment, please?","You do not need that dictionary, do you?"],"a":3},{"q":"<b>23. Your group has completed a presentation, but one member has not finished the visual materials. What is the most appropriate response?</b>","o":["We should blame the member who has not finished.","Let's help finish the visual materials so we can submit the presentation on time.","We should cancel the presentation without discussing it.","Nobody needs to finish the materials anymore.","We can submit the presentation even if it is incomplete."],"a":1},{"q":"<b>24. The school introduced a new policy to ______ students' awareness of environmental issues.</b>","o":["raise","rise","arise","arise from","risen"],"a":0},{"q":"<b>25. The research findings were reliable because they were based on ______ evidence collected over several months.</b>","o":["misleading","accidental","insufficient","substantial","imaginary"],"a":3},{"q":"<b>26. Choose the sentence with the correct parallel structure.</b>","o":["The program aims to reduce waste, conserving energy, and the protection of wildlife.","The program aims to reduce waste, uld ensure that every member contributes fairly so that group work remains effective.”<br><br><b>Which statement best represents the writer's position?</b>","o":["Group projects should be eliminated because students cannot work independently.","Students should complete every assignment without communicating with others.","Group projects are beneficial, provided that teachers ensure fair participation.","Teachers should allow only the most intelligent students to lead all group projects.","Communication skills are less important than individual examination scores."],"a":2}];

let current=0;
let answers=Array(questions.length).fill(null);
let resultMode=false;
let finalCorrect=0;
let examFinished=false;
const letters=['A','B','C','D','E'];

function renderNav(){
  const nav=document.getElementById('qnav');
  nav.innerHTML='';
  questions.forEach((item,i)=>{
    const b=document.createElement('button');
    let cls='qnav';
    if(i===current) cls+=' active';

    if(resultMode){
      const isCorrect=item.multi ? sameSet(answers[i],item.a) : answers[i]===item.a;
      if(isCorrect) cls+=' result-correct';
      else cls+=' result-wrong';
    }else if(answers[i]!==null){
      cls+=' answered';
    }

    b.className=cls;
    b.textContent=i+1;
    b.onclick=()=>{
      current=i;
      if(!resultMode) renderQuestion();
    };
    nav.appendChild(b);
  });

  const counter=document.getElementById('counter');
  if(resultMode){
    counter.textContent=`${finalCorrect} / ${questions.length} Benar`;
  }else{
    const n=answers.filter(x=>x!==null).length;

function renderQuestion(){
  const item=questions[current];
  document.getElementById('qtitle').textContent=`Soal Nomor ${current+1}`;
  const done=answers[current]!==null;
  const status=document.getElementById('status');
  status.textContent=done?'Sudah Dijawab':'Belum Dijawab';
  status.className='status'+(done?' done':'');
  const body=document.getElementById('qbody');
  let options='';
  item.o.forEach((opt,i)=>{
    let checked=item.multi ? (Array.isArray(answers[current]) && answers[current].includes(i)) : answers[current]===i;
    options+=`<label class="option ${checked?'selected':''}">
      <input type="${item.multi?'checkbox':'radio'}" name="answer" value="${i}" ${checked?'checked':''} onchange="selectAnswer(${i})">
      <span class="letter">${letters[i]}</span><span>${opt}</span>
    </label>`;
  });
  body.innerHTML=`<p class="question-text">${item.q}</p><div class="options">${options}</div>`;
  document.getElementById('prev').disabled=current===0;
  document.getElementById('next').textContent=current===questions.length-1?'Selesai →':'Selanjutnya →';
  renderNav();
}
function selectAnswer(i){
  const item=questions[current];
  if(item.multi){
    let arr=Array.isArray(answers[current])?[...answers[current]]:[];
    const idx=arr.indexOf(i);
    if(idx>=0) arr.splice(idx,1); else arr.push(i);
    arr.sort((a,b)=>a-b);
    answers[current]=arr.length?arr:null;
  }else answers[current]=i;
  renderQuestion();
}
function prevQuestion(){if(current>0){current--;renderQuestion()}}
function nextQuestion(){
  if(current<questions.length-1){current++;renderQuestion()}
  else finishQuiz();
}
function sameSet(a,b){
  if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length)return false;
  return a.every((v,i)=>v===b[i]);
}

function pdfSafe(text){
  return String(text)
    .replace(/[–—]/g,'-').replace(/÷/g,'/').replace(/×/g,'x')
    .replace(/°/g,' deg ').replace(/²/g,'2').replace(/³/g,'3')
    .replace(/−/g,'-').replace(/≤/g,'<=').replace(/≥/g,'>=')
    .replace(/[“”]/g,'"').replace(/[‘’]/g,"'")
    .replace(/[^\x20-\x7E]/g,'');
}

function wrapPdf(text,maxChars){
  const words=pdfSafe(text).split(/\s+/);
  const lines=[];
  let line='';
  for(const word of words){
    if((line+' '+word).trim().length>maxChars){
      if(line) lines.push(line);
      line=word;
    }else{
      line=(line+' '+word).trim();
    }
  }
  if(line) lines.push(line);
  return lines;
}
